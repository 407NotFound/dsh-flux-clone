name: android
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: gradle
        run: |
          curl -sSL -o g.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q g.zip
          ./gradle-8.7/bin/gradle -v
      - name: build
        run: ./gradle-8.7/bin/gradle -p . :app:assembleRelease --no-daemon -q
      - name: find apk
        run: |
          find . -name '*.apk' -exec ls -l {} \;
          cp $(find . -name 'app-release.apk' | head -1) FluxClone-1.1.apk
      - name: publish
        run: |
          git config user.name bot; git config user.email bot@b
          git add FluxClone-1.1.apk
          git commit -m "build apk" || true
          git push
