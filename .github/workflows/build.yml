name: android
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: native
        run: |
          set -eux
          NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}
          echo "NDK=$NDK"
          cmake -S app/src/main/cpp -B build/native \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native -j4
          find build/native -name 'libfluxui.so' -exec ls -l {} \;
      - name: apk
        run: |
          set -eux
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          BT=$SDK/build-tools/34.0.0
          AJ=$SDK/platforms/android-34/android.jar
          M=app/src/main
          rm -rf build/out && mkdir -p build/out/gen build/out/classes build/out/lib/arm64-v8a
          cp build/native/libfluxui.so build/out/lib/arm64-v8a/
          mkdir -p build/out/assets
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf build/out/assets/
          $BT/aapt2 compile --dir $M/res -o build/out/res.zip
          $BT/aapt2 link -o build/out/base.apk -I "$AJ" --manifest $M/AndroidManifest.xml \
              --java build/out/gen --min-sdk-version 26 --target-sdk-version 34 \
              -A build/out/assets -R build/out/res.zip --auto-add-overlay
          javac -source 17 -target 17 -nowarn -cp "$AJ" -d build/out/classes \
              $(find $M/java build/out/gen -name '*.java')
          $BT/d8 --lib "$AJ" --min-api 26 --output build/out $(find build/out/classes -name '*.class')
          cd build/out && zip -q base.apk classes.dex && zip -qr base.apk lib assets && cd ../..
          $BT/zipalign -f 4 build/out/base.apk build/out/aligned.apk
          keytool -genkeypair -keystore build/out/dk.jks -storepass android -keypass android \
              -alias k -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Flux" 2>/dev/null || true
          $BT/apksigner sign --ks build/out/dk.jks --ks-pass pass:android --key-pass pass:android \
              --out FluxClone-1.3.apk build/out/aligned.apk
          ls -l FluxClone-1.3.apk
      - name: publish
        run: |
          git config user.name bot; git config user.email bot@b
          git add FluxClone-1.3.apk
          git commit -m "build apk 1.3 (imgui)" || true
          git push
