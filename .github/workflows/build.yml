name: android
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: raw build
        run: |
          set -eux
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          BT=$(ls -d $SDK/build-tools/* | sort -V | tail -1)
          AJ=$SDK/platforms/android-34/android.jar
          echo "BT=$BT"; echo "AJ=$AJ"
          M=app/src/main
          rm -rf build && mkdir -p build/gen build/classes
          $BT/aapt2 compile --dir $M/res -o build/res.zip
          $BT/aapt2 link -o build/base.apk -I "$AJ" --manifest $M/AndroidManifest.xml \
              --java build/gen --min-sdk-version 26 --target-sdk-version 34 -R build/res.zip \
              --auto-add-overlay
          javac -source 17 -target 17 -bootclasspath "$AJ" -d build/classes \
              $(find $M/java build/gen -name '*.java')
          $BT/d8 --lib "$AJ" --min-api 26 --output build $(find build/classes -name '*.class')
          cd build && zip -q base.apk classes.dex && cd ..
          $BT/zipalign -f 4 build/base.apk build/aligned.apk
          keytool -genkeypair -keystore build/dk.jks -storepass android -keypass android \
              -alias k -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Flux" 2>/dev/null || true
          $BT/apksigner sign --ks build/dk.jks --ks-pass pass:android --key-pass pass:android \
              --out FluxClone-1.1.apk build/aligned.apk
          ls -l FluxClone-1.1.apk
      - name: publish
        run: |
          git config user.name bot; git config user.email bot@b
          git add FluxClone-1.1.apk
          git commit -m "build apk v1.1" || true
          git push
