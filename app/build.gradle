plugins { id 'com.android.application' }

android {
    namespace 'local.flux'
    compileSdk 34

    defaultConfig {
        applicationId "local.flux"
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "1.1"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
